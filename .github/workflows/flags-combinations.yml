name: Flag combinations (periodic)

on:
  schedule:
    # Off the top of the hour: GitHub delays (or drops) scheduled runs most at minute 0.
    - cron: '17 3 * * 0,3'   # every Sunday and Wednesday 03:17 UTC (runs on the default branch only)
  workflow_dispatch:
    inputs:
      wave_count:
        description: 'Combinations per wave (keep constant during a campaign)'
        default: '20'
      random_count:
        description: 'Additional random combinations'
        default: '0'
      wave:
        description: 'Wave number (empty = run number - 1)'
        default: ''
      seed:
        description: 'Seed of the random combinations (empty = run number)'
        default: ''
      report_issues:
        description: 'Open / comment GitHub issues for the failures (scheduled runs always do)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Per-attempt limit (seconds) of scripts/retry.sh: a stalled FetchContent download is retried instead of freezing the job.
  RETRY_TIMEOUT: 900
  # CMake options common to every leg; the failure report repeats them in its reproduction commands.
  CMAKE_FIXED_ARGS: >-
    -D CMAKE_BUILD_TYPE=Debug
    -D CMAKE_C_COMPILER=clang-21
    -D CMAKE_CXX_COMPILER=clang++-21
    -D AERONET_WARNINGS_AS_ERRORS=ON
    -D AERONET_BUILD_TESTS=ON
    -D AERONET_ENABLE_TEST_HOOKS=ON
    -D AERONET_BUILD_EXAMPLES=ON
    -D AERONET_ENABLE_ASAN=OFF
    -D AERONET_ENABLE_CLANG_TIDY=OFF
    -D AERONET_BENCH_ENABLE_OATPP=OFF
    -D AERONET_BENCH_ENABLE_DROGON=OFF
    -D AERONET_BENCH_ENABLE_HTTPLIB=OFF
    -D AERONET_BENCH_ENABLE_PISTACHE=OFF
    -D AERONET_BENCH_ENABLE_CROW=OFF
    -D AERONET_BENCH_ENABLE_BEAST=OFF
    -D AERONET_BENCH_ENABLE_UWEBSOCKETS=OFF

permissions:
  contents: read

defaults:
  run:
    # Explicit bash enables pipefail: piping a step to tee keeps its exit status.
    shell: bash

jobs:
  generate:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Install numpy
        run: python3 -m pip install --disable-pip-version-check --quiet numpy

      - name: Generate matrix
        id: gen
        env:
          WAVE_COUNT: ${{ inputs.wave_count || '20' }}
          RANDOM_COUNT: ${{ inputs.random_count || '0' }}
          WAVE: ${{ inputs.wave || '' }}
          RUN_NUMBER: ${{ github.run_number }}
          # Run number of the first run of the current campaign. Set it to the next run number
          # whenever FLAGS or the constraints of gen-flag-matrix.py change, to restart from wave 0.
          FIRST_RUN_NUMBER: 32
          SEED: ${{ inputs.seed || github.run_number }}
        run: |
          # Every run (scheduled or manual) advances one wave; the first run of the campaign is wave 0.
          wave="${WAVE:-$(( RUN_NUMBER - FIRST_RUN_NUMBER ))}"
          matrix=$(python3 scripts/gen-flag-matrix.py \
            --wave-count "$WAVE_COUNT" --wave "$wave" \
            --random-count "$RANDOM_COUNT" --seed "$SEED" \
            --info-file "$GITHUB_STEP_SUMMARY")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-test:
    # Quoted: an unquoted ' #' starts a YAML comment. The report links legs to their jobs by this '#id' suffix.
    name: 'clang-21 ${{ matrix.kind }} #${{ matrix.id }}'
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    env:
      LEG_CMAKE_ARGS: ${{ matrix.cmake_args }}
    steps:
      - uses: actions/checkout@v7

      - name: Show flags
        run: echo "$LEG_CMAKE_ARGS" | sed 's/ -D/\n-D/g'

      # Optional system libs are always installed: the flags decide whether the code uses them.
      - name: Install dependencies
        run: |
          ./scripts/ci-apt-install.sh ninja-build libjsoncpp-dev uuid-dev libssl-dev \
            libcurl4-openssl-dev libprotobuf-dev protobuf-compiler

      - name: Install Clang/LLVM toolchain
        run: ./scripts/ci-apt-install.sh --llvm 21

      # The logs of the configure / build / test steps are kept for the error extraction of the last steps.
      - name: Configure (CMake)
        id: configure
        run: |
          mkdir -p logs
          # shellcheck disable=SC2086 # the options are word-split on purpose
          ./scripts/retry.sh cmake -S . -B build -G Ninja $CMAKE_FIXED_ARGS $LEG_CMAKE_ARGS 2>&1 | tee logs/configure.log

      # -k 0: keep going after a failure to report all the errors of the combination, not only the first one.
      - name: Build
        id: build
        run: cmake --build build --parallel -- -k 0 2>&1 | tee logs/build.log

      - name: Run unit tests
        id: test
        run: ctest --test-dir build --output-on-failure --timeout 60 -j --repeat until-pass:3 2>&1 | tee logs/test.log

      # continue-on-error: the reporting tooling never changes the verdict of a leg.
      - name: Extract errors
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 scripts/report-flag-matrix.py leg --id '${{ matrix.id }}' --kind '${{ matrix.kind }}' \
            --cmake-args="$LEG_CMAKE_ARGS" --outcome 'configure=${{ steps.configure.outcome }}' \
            --outcome 'build=${{ steps.build.outcome }}' --outcome 'test=${{ steps.test.outcome }}' \
            --logs-dir logs --out 'leg-result/leg-${{ matrix.id }}.json'

      - name: Upload leg result
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: flag-leg-${{ matrix.id }}
          path: leg-result/
          retention-days: 7

  report:
    name: Report failures
    needs: [generate, build-test]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read    # links from the legs to their job logs
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Download leg results
        uses: actions/download-artifact@v8
        with:
          pattern: flag-leg-*
          path: leg-results
          merge-multiple: true

      # Groups the failing legs by shared errors into the run summary, with reproduction commands. Scheduled runs
      # (or report_issues) also open one issue per new category, or comment on the open issue of a known one.
      - name: Group and report failures
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.generate.outputs.matrix }}
          FILE_ISSUES: ${{ github.event_name == 'schedule' || inputs.report_issues }}
        run: |
          args=()
          if [[ "$FILE_ISSUES" == true ]]; then args+=(--file-issues); fi
          python3 scripts/report-flag-matrix.py report --matrix="$MATRIX" --results-dir leg-results \
            --summary "$GITHUB_STEP_SUMMARY" "${args[@]}"