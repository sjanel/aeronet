# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: aeronet
site_description: High-performance, modular C++23 HTTP, HTTP/2, and WebSocket server library.
site_url: https://sjanel.github.io/aeronet/
repo_url: https://github.com/sjanel/aeronet
repo_name: sjanel/aeronet
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: material/rocket-launch-outline
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - scripts/mkdocs_source_links.py

plugins:
  - search
  - redirects:
      redirect_maps:
        protocols/tls-and-http2.md: protocols/tls.md
        protocols/client-and-jwt.md: modules/http-client.md
        guides/middleware-and-responses.md: guides/middleware.md
        guides/bodies-streaming-and-files.md: guides/streaming-responses.md
        FEATURES.md: index.md

validation:
  links:
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - Your first server: getting-started/first-server.md
      - Installation and build: INSTALL.md
  - Guides:
      - Routing: guides/routing.md
      - Requests: guides/requests.md
      - Responses: guides/responses.md
      - Streaming responses: guides/streaming-responses.md
      - Static files: guides/static-files.md
      - Async handlers: guides/async-handlers.md
      - Middleware: guides/middleware.md
      - CORS: guides/cors.md
      - Compression: guides/compression.md
      - Servers and lifecycle: guides/server-lifecycle.md
      - Production deployment patterns: guides/production-configuration.md
  - Protocols:
      - TLS: protocols/tls.md
      - HTTP/2: protocols/http2.md
      - WebSocket: protocols/websocket.md
      - CONNECT tunneling: protocols/connect.md
  - Modules:
      - HTTP client: modules/http-client.md
      - JWT: modules/jwt.md
      - JSON, YAML, and configuration files: modules/json-and-config-files.md
  - Reference:
      - Build configuration: reference/configuration.md
      - Server configuration: reference/server-configuration.md
      - Client configuration: reference/client-configuration.md
      - HTTP/1.1 conformance: reference/http-conformance.md
  - Operations:
      - Observability and logging: operations/observability.md
      - Performance and tuning: operations/performance.md
      - Health probes: operations/health-probes.md
      - Kubernetes: kubernetes-examples.md
      - Benchmarks: BENCHMARKS.md
  - Project:
      - Documentation development: development/documentation.md
      - Testing: development/testing.md
      - Changelog: CHANGELOG.md
      - Roadmap: ROADMAP.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sjanel/aeronet
      name: aeronet on GitHub

copyright: Copyright &copy; 2024-2026 aeronet contributors
