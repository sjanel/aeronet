name: Flag combinations (periodic)

on:
  schedule:
    # Off the top of the hour: GitHub delays (or drops) scheduled runs most at minute 0.
    - cron: '17 3 * * 0,3'   # every Sunday and Wednesday 03:17 UTC (runs on the default branch only)
  workflow_dispatch:
    inputs:
      wave_count:
        description: 'Combinations per wave (keep constant during a campaign)'
        default: '20'
      random_count:
        description: 'Additional random combinations'
        default: '0'
      wave:
        description: 'Wave number (empty = run number - 1)'
        default: ''
      seed:
        description: 'Seed of the random combinations (empty = run number)'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Install numpy
        run: python3 -m pip install --disable-pip-version-check --quiet numpy

      - name: Generate matrix
        id: gen
        env:
          WAVE_COUNT: ${{ inputs.wave_count || '20' }}
          RANDOM_COUNT: ${{ inputs.random_count || '0' }}
          WAVE: ${{ inputs.wave || '' }}
          RUN_NUMBER: ${{ github.run_number }}
          # Run number of the first run of the current campaign. Set it to the next run number
          # whenever FLAGS or the constraints of gen-flag-matrix.py change, to restart from wave 0.
          FIRST_RUN_NUMBER: 1
          SEED: ${{ inputs.seed || github.run_number }}
        run: |
          # Every run (scheduled or manual) advances one wave; the first run of the campaign is wave 0.
          wave="${WAVE:-$(( RUN_NUMBER - FIRST_RUN_NUMBER ))}"
          matrix=$(python3 scripts/gen-flag-matrix.py \
            --wave-count "$WAVE_COUNT" --wave "$wave" \
            --random-count "$RANDOM_COUNT" --seed "$SEED" \
            --info-file "$GITHUB_STEP_SUMMARY")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-test:
    name: clang-21 ${{ matrix.kind }} #${{ matrix.id }}
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    env:
      CC: clang-21
      CXX: clang++-21
    steps:
      - uses: actions/checkout@v7

      - name: Show flags
        run: echo "${{ matrix.cmake_args }}" | tr ' ' '\n'

      # Optional system libs are always installed: the flags decide whether the code uses them.
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ninja-build libjsoncpp-dev uuid-dev libssl-dev \
            libcurl4-openssl-dev libprotobuf-dev protobuf-compiler

      - name: Install Clang/LLVM toolchain
        run: |
          wget --retry-connrefused --waitretry=5 --tries=5 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y lld-21

      - name: Configure (CMake)
        run: |
          ./scripts/retry.sh cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAERONET_BUILD_TESTS=ON \
            -DAERONET_ENABLE_TEST_HOOKS=ON \
            -DAERONET_BUILD_EXAMPLES=OFF \
            -DAERONET_ENABLE_ASAN=OFF \
            -DAERONET_ENABLE_CLANG_TIDY=OFF \
            -DAERONET_BENCH_ENABLE_OATPP=OFF \
            -DAERONET_BENCH_ENABLE_DROGON=OFF \
            -DAERONET_BENCH_ENABLE_HTTPLIB=OFF \
            -DAERONET_BENCH_ENABLE_PISTACHE=OFF \
            -DAERONET_BENCH_ENABLE_CROW=OFF \
            -DAERONET_BENCH_ENABLE_BEAST=OFF \
            -DAERONET_BENCH_ENABLE_UWEBSOCKETS=OFF \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --timeout 60 -j

  report:
    name: Report failures
    needs: build-test
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Periodic flag-combination build failed ($(date -u +%F))" \
            --body "See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} . Failing legs show their exact CMake flags; the run summary shows the wave and the seed."